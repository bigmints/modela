services:
  modela:
    build: .
    user: "${MODELA_UID:-1000}:${MODELA_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      MODELA_HF_LIMIT_PER_TASK: "${MODELA_HF_LIMIT_PER_TASK:-200}"
      MODELA_INCLUDE_PAID_OPENROUTER: "${MODELA_INCLUDE_PAID_OPENROUTER:-false}"
      MODELA_MAX_DROP_RATIO: "${MODELA_MAX_DROP_RATIO:-0.5}"
    restart: "no"
    command: ["update"]
